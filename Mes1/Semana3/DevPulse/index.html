<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <title>DevPulse | Stats for GitHub profiles</title>
    <meta
      name="description"
      content="Search any GitHub developer to explore their profile, contributions, latest commits and updated repositories."
    />

    <link rel="icon" type="image/png" href="/zenentechicon.png" />
    <link rel="apple-touch-icon" href="/zenentechicon.png" />
    <link rel="canonical" href="https://devpulse.zenen.tech/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevPulse" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="DevPulse | Stats for GitHub profiles" />
    <meta
      property="og:description"
      content="Search any GitHub developer to explore their profile, contributions, latest commits and updated repositories."
    />
    <meta property="og:url" content="https://devpulse.zenen.tech/" />

    <meta property="og:image" content="https://devpulse.zenen.tech/metadataimglight.png" />
    <meta property="og:image:alt" content="DevPulse search screen in light mode" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1921" />
    <meta property="og:image:height" content="912" />

    <meta property="og:image" content="https://devpulse.zenen.tech/metadataimgdark.png" />
    <meta property="og:image:alt" content="DevPulse search screen in dark mode" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1921" />
    <meta property="og:image:height" content="907" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@zenendev" />
    <meta name="twitter:creator" content="@zenendev" />
    <meta name="twitter:title" content="DevPulse | Stats for GitHub profiles" />
    <meta
      name="twitter:description"
      content="Search any GitHub developer to explore their profile, contributions, latest commits and updated repositories."
    />
    <meta name="twitter:image" content="https://devpulse.zenen.tech/metadataimgdark.png" />
    <meta name="twitter:image:alt" content="DevPulse search screen in dark mode" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
